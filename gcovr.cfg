# Coverage gate for cAdvent 2026 (see openspec quality-gates).
# Measured over first-party code in src/ and tools/, aggregated from unit
# tests AND headless game tests. Only third-party code and tests are excluded;
# individual untestable lines (allocation failure, broken driver) carry an
# explicit GCOVR_EXCL marker in the source.
filter = src/
filter = tools/
exclude = third_party/
exclude = tests/
exclude-unreachable-branches = yes
exclude-throw-branches = yes
fail-under-line = 95
fail-under-branch = 85
print-summary = yes
